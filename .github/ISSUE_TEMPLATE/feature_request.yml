name: Feature request
description: Something you would like Imbox to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: Describe the problem first, then the way you would solve it. There may be a way to do it already.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now, or have considered
    validations:
      required: false
  - type: checkboxes
    id: help
    attributes:
      label: Can you help
      options:
        - label: I would be willing to work on this and open a pull request
