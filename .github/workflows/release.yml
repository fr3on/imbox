# Cuts a release when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0). See imbox-website/docs/content/docs/releasing.mdx.
# It checks that the tag, package.json, the extension manifest and CHANGELOG.md agree, runs the same checks as a pull request, then builds
#   - the server package (imbox-X.Y.Z.tgz: the built web app, the Node bundle and the server files),
#   - the browser extension (imbox-extension-X.Y.Z.zip),
#   - the desktop app for Mac, Windows and Linux (imbox-X.Y.Z-mac.dmg, -windows.exe, -linux.AppImage and -linux.deb; not code-signed yet),
#   - the Docker image ghcr.io/fr3on/imbox:X.Y.Z (also :X.Y, and :latest for a release that is not a pre-release),
# and publishes them in a GitHub release whose text is that version's section of CHANGELOG.md. No secret to add: it uses the workflow's own token.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The tag, package.json, the extension and the changelog agree
        run: node scripts/release.mjs check "$GITHUB_REF_NAME"
      - name: The tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main. Tag a commit that has been merged."; exit 1; }

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: npm run build:node
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir out
          tar -czf "out/imbox-$VERSION.tgz" dist node-dist server package.json package-lock.json
          (cd apps/extension && zip -qr "../../out/imbox-extension-$VERSION.zip" . -x '*.DS_Store')
          (cd out && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: out/
          retention-days: 7

  desktop:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: apps/desktop
      - name: Build
        working-directory: apps/desktop
        run: npx tauri build
      - name: Name the files
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          B=apps/desktop/src-tauri/target/release/bundle
          mkdir out
          case "$RUNNER_OS" in
            macOS) cp "$B"/dmg/*.dmg "out/imbox-$VERSION-mac.dmg" ;;
            Windows) cp "$B"/nsis/*.exe "out/imbox-$VERSION-windows.exe" ;;
            Linux)
              cp "$B"/appimage/*.AppImage "out/imbox-$VERSION-linux.AppImage"
              cp "$B"/deb/*.deb "out/imbox-$VERSION-linux.deb" ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: out/
          retention-days: 7

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest is added for a stable version only; a tag such as v0.2.0-rc.1 gets just its own number.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [package, desktop, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: out
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: out
          merge-multiple: true
      - name: Checksums of the desktop apps
        run: (cd out && sha256sum imbox-*-mac.dmg imbox-*-windows.exe imbox-*-linux.* >> SHA256SUMS)
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/release.mjs notes "$VERSION" > notes.md
          {
            echo
            echo "---"
            echo
            echo "**Install or update:** \`docker pull ghcr.io/${GITHUB_REPOSITORY}:$VERSION\`, or unpack \`imbox-$VERSION.tgz\` on a server (see imbox-website/docs/content/docs/updating.mdx). Check the files against \`SHA256SUMS\`."
          } >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --verify-tag --title "Imbox $VERSION" --notes-file notes.md $FLAGS
