# Tests, builds and ships Inbox to your own server (see imbox-website/docs/content/docs/self-hosting.mdx). Runs on every push to main, or by hand.
# Repository secrets: DEPLOY_HOST (the server's IP or an unproxied hostname: ssh cannot go through Cloudflare's proxy), DEPLOY_USER (ssh user),
# DEPLOY_SSH_KEY (private key), DEPLOY_KNOWN_HOSTS (output of `ssh-keyscan -H your-host`). The deploy user needs passwordless sudo for `inbox-activate` only.
# Repository variables: SELFHOST_DEPLOY ("true" turns the deploy job on) and DEPLOY_URL (the public address, for the health check, for example https://inbox.example.com).
name: Deploy (self-hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-selfhost
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check

  # The tests are the slow part, so they run as three parallel shards. Each shard has its own PostgreSQL.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inbox
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: inbox_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U inbox" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgres://inbox@localhost:54329/inbox_test
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (Node, PostgreSQL)
        run: npx vitest run --shard=${{ matrix.shard }}/3

  # Builds the self-hosted bundle once, tests it against Postgres, and keeps the package for the deploy job.
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inbox
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: inbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inbox" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_TEST_URL: postgres://inbox@localhost:5432/inbox_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the self-hosted bundle
        run: npm run build:node
      - name: Tests (Postgres, end to end)
        run: npm run test:pg
      - name: Package
        run: tar -czf release.tgz dist node-dist server package.json package-lock.json
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release.tgz
          retention-days: 3

  deploy:
    needs: [check, test, build]
    # Off until the repository variable SELFHOST_DEPLOY is set to "true" (Settings > Secrets and variables > Actions > Variables), after the secrets above exist.
    if: github.ref == 'refs/heads/main' && vars.SELFHOST_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Ship and activate
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
        run: |
          SHA=${GITHUB_SHA::8}
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          scp -i ~/.ssh/id_deploy release.tgz "$USER_@$HOST:/tmp/inbox-$SHA.tgz"
          ssh -i ~/.ssh/id_deploy "$USER_@$HOST" "sudo inbox-activate /tmp/inbox-$SHA.tgz $SHA"
      - name: Check the public URL
        run: curl -fsS --retry 5 --retry-delay 3 "${{ vars.DEPLOY_URL }}/healthz"
