# Publishes the self-hosted image to ghcr.io/fr3on/imbox as :edge (the newest main) and :sha-... after the deploy workflow's tests pass on main, or by hand.
# Version tags (1.2.3, 1.2, latest) are published by the release workflow, after its own checks.
# Pushes to the GitHub Container Registry with the workflow's own token; no secret to add.
name: Docker image

on:
  workflow_run:
    workflows: ["Deploy (self-hosted)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=edge
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
