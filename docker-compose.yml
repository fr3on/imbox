# Imbox and its database. Copy .env.example to .env, fill it in, then: docker compose up -d
# Put a TLS proxy (Caddy, for example) in front of port 8787; see imbox-website/docs/content/docs/self-hosting.mdx.
services:
  imbox:
    image: ghcr.io/fr3on/imbox:latest
    # build: .   # use this line instead of the image to build it yourself
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://inbox:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/inbox
      APP_URL: ${APP_URL:?set APP_URL in .env, for example https://inbox.example.com}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -hex 32)}
      APP_NAME: ${APP_NAME:-imbox}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "127.0.0.1:8787:8787"

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: inbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: inbox
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db:
